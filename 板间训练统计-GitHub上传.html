ize:15}),"\u5F00\u59CB\u65B0\u7684\u8BAD\u7EC3"]})]}),(0,s.jsxs)("div",{className:"info-note",children:[(0,s.jsx)(Hl,{size:18}),(0,s.jsx)("p",{children:"\u4F53\u9A8C\u7248\u652F\u6301\u624B\u52A8\u8BA1\u65F6\u4E0E\u8BB0\u5F55\u3002\u81EA\u52A8\u8BC6\u522B\u3001\u771F\u5B9E\u8FD0\u52A8\u6570\u636E\u4E0E\u4F20\u611F\u5668\u8FDE\u63A5\u5C1A\u672A\u63A5\u5165\u3002"})]})]})]})]}),a==="rides"&&(0,s.jsx)(RideStatistics,{onPractice:()=>e("practice")}),a==="practice"&&(0,s.jsx)(PracticeTraining,{}),a==="tricks"&&(0,s.jsx)("section",{className:"basic-teaching",onClick:function(ev){let b=ev.target.closest("[data-practice]");if(b){window.__banjianPracticeAction=b.dataset.practice;e("practice")}},dangerouslySetInnerHTML:{__html:"<header><div class=\"eyebrow\">板间 / 基础动作教学</div><h1>从基础开始，稳稳进步。</h1><p>点击“动作要点”查看说明；参考来源始终可见。</p><div><button class=\"turn-practice\" data-practice=\"左转\">开始左转练习</button><button class=\"turn-practice\" data-practice=\"右转\">开始右转练习</button></div></header><article class=\"lesson\"><div class=\"number\">01 / 基础动作</div><h2>豚跳接前轮平衡</h2><button class=\"lesson-practice\" data-practice=\"豚跳接前轮平衡\">练习这个动作</button><p class=\"english\">Ollie to Nose Manual</p><a class=\"video\" href=\"https://v.douyin.com/SCqRZYgb9F4/\" target=\"_blank\" rel=\"noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>点击打开抖音分享链接 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：豚跳接前轮平衡，是先让人与板一起跃起，再以前轮接地、抬起后轮，保持一小段平衡滑行。先熟悉稳定滑行、豚跳和单独的前轮平衡，再把它们连起来练习。</p><p>准备与起跳：选择平整、干燥、空旷的地面，戴好头盔和护具。前脚放在靠近前桥的位置，后脚踩住板尾；屈膝后点板、带板起跳，视线关注前方，保持身体在板的上方。先练低而稳定的跳跃，不急着追求高度。</p><p>接板与平衡：落下前准备好进入前轮平衡，让前轮先平稳接触地面，后轮保持抬起。重心靠近前桥，但不要把头和身体过度探到板头前面；前脚控制压力，后脚轻微调整板尾高度，双臂辅助保持平衡。</p><p>常见问题：板头碰地或人向前扑，通常要检查是否压得太靠前；后轮很快落地，则可从短距离开始，逐步寻找平衡点。结束时缓慢放下后轮，屈膝继续滑行。练习不稳时及时停下调整，不要强求一次成功。</p></div></details><p class=\"source\">参考来源：<a href=\"https://nollieskateboarding.com/en/nose-manual\" target=\"_blank\" rel=\"noreferrer\">Nollie Skateboarding：前轮平衡教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">02 / 基础动作</div><h2>豚跳</h2><button class=\"lesson-practice\" data-practice=\"豚跳\">练习这个动作</button><p class=\"english\">Ollie</p><a class=\"video\" href=\"https://www.douyin.com/video/7643673614098108840\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>Ollie · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：后脚点板尾，前脚带板向板头滑动，人与板一起跃起。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：前脚置于板中部，后脚踩板尾。后脚点板尾，前脚向板头带板。人在空中将板带平。双脚落在桥钉附近，屈膝缓冲。先稳定滑行，再分开练习点板与带板。点板不是向后踢飞滑板，起跳时重心尽量保持在板上方。</p><p>注意事项：不要只顾前脚刷板而忘了抬起后脚；落地时看清板面，双脚接近桥钉位置，屈膝吸收冲击。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://www.skatedeluxe.com/blog/en/trick-tips/skateboard/flat/how-to-ollie/\" target=\"_blank\" rel=\"noreferrer\">skatedeluxe：动作教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">03 / 基础动作</div><h2>尖翻</h2><button class=\"lesson-practice\" data-practice=\"尖翻\">练习这个动作</button><p class=\"english\">Kickflip</p><a class=\"video\" href=\"https://www.douyin.com/video/7682032672696338255\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>Kickflip · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：点板起跳后，前脚向脚跟侧踢出，板沿长轴翻转一周。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：以前脚靠近前桥、后脚踩尾准备。点板并向脚跟侧踢出前脚。板绕长轴翻转，板底短暂朝上。砂纸面再次朝上时接板落地。前脚从板头外侧轻快拨出后及时收回，给滑板留出翻转空间；动作方向按自己的常规站姿调整。</p><p>注意事项：避免前脚向下猛踢，否则滑板容易被压回地面。盯住板面，等砂纸面重新朝上再用双脚接住。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://www.skatedeluxe.com/blog/en/trick-tips/skateboard/flat/how-to-kickflip/\" target=\"_blank\" rel=\"noreferrer\">skatedeluxe：动作教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">04 / 基础动作</div><h2>板转一百八十度</h2><button class=\"lesson-practice\" data-practice=\"板转一百八十度\">练习这个动作</button><p class=\"english\">Pop Shuvit</p><a class=\"video\" href=\"https://www.douyin.com/video/7682688338125842575\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>Pop Shuv-it · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：后脚点板并向身后扫板，让板水平转半圈，身体基本保持朝向。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：以豚跳站姿准备。后脚点板尾并向身后扫板。板在脚下水平转动，身体不跟转。板转满半圈后双脚接板。后脚点板的同时向身后扫动，前脚适度让出空间；滑板水平旋转，而身体尽量保持原来的朝向。</p><p>注意事项：不要让双脚只追着板尾跑。观察旋转后的板面，在板身接近半圈、砂纸面朝上时双脚接板。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://www.skatedeluxe.com/blog/en/trick-tips/skateboard/flat/how-to-pop-shove-it/\" target=\"_blank\" rel=\"noreferrer\">skatedeluxe：板转教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">05 / 基础动作</div><h2>跟翻</h2><button class=\"lesson-practice\" data-practice=\"跟翻\">练习这个动作</button><p class=\"english\">Heelflip</p><a class=\"video\" href=\"https://www.douyin.com/video/7684518271387065768\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>Heel Flip · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：点板起跳后，用前脚脚跟向脚尖侧踢板，翻转方向与尖翻相反。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：前脚脚尖略微伸出板边，后脚踩尾。点板并向脚尖侧踢出脚跟。板沿长轴翻转，板底短暂朝上。砂纸面再次朝上时接板落地。以前脚脚跟向脚尖侧拨板，注意给滑板留出翻转空间。起跳后收回前脚，让双脚都能回到板面上方。</p><p>注意事项：与尖翻的翻转方向相反；不要向下猛踢。看清砂纸面回到上方，再尝试双脚接板并屈膝落地。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://www.skatedeluxe.com/blog/en/trick-tips/skateboard/flat/how-to-heelflip/\" target=\"_blank\" rel=\"noreferrer\">skatedeluxe：动作教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">06 / 基础动作</div><h2>背向 180</h2><button class=\"lesson-practice\" data-practice=\"背向 180\">练习这个动作</button><p class=\"english\">Backside 180</p><a class=\"video\" href=\"https://www.douyin.com/video/7676717285046243663\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>B/S 180 · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：肩膀带动身体向背侧旋转，人与板共同转动半圈。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：以豚跳站姿准备，肩膀预转。点板跳起，肩膀带动身体背侧转动。双脚与滑板随身体一同转向。人与板完成半圈后屈膝落地。先用肩膀带动身体向背侧转动，再让髋部、双脚与滑板跟随；人与板共同旋转，身体不必强行扭膝。</p><p>注意事项：可先练小角度的稳定落地，再逐渐增加转角。落地后顺着新的滑行方向继续移动，视线注意转体方向。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://www.skatedeluxe.com/blog/en/trick-tips/skateboard/flat/how-to-bs-180-ollie/\" target=\"_blank\" rel=\"noreferrer\">skatedeluxe：动作教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">07 / 基础动作</div><h2>大乱</h2><button class=\"lesson-practice\" data-practice=\"大乱\">练习这个动作</button><p class=\"english\">360 Flip</p><a class=\"video\" href=\"https://www.douyin.com/video/7693178873618442664\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>Tre Flip · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：后脚扫板使板水平转一圈，同时前脚完成尖翻；身体基本不转。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：后脚在板尾准备扫板，前脚准备尖翻。后脚点扫，前脚同时踢翻。板水平旋转一圈，同时沿长轴翻一圈。待砂纸面朝上时双脚接板。后脚扫板带动水平旋转，前脚同时完成尖翻的拨板动作；身体尽量保持朝向，给板充足的旋转空间。</p><p>注意事项：这是进阶动作，先掌握尖翻和板转，再练二者的配合。观察砂纸面与板的位置，双脚同时接板。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://www.skatedeluxe.com/blog/en/trick-tips/skateboard/flat/how-to-360-flip-treflip/\" target=\"_blank\" rel=\"noreferrer\">skatedeluxe：动作教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">08 / 基础动作</div><h2>后轮平衡</h2><button class=\"lesson-practice\" data-practice=\"后轮平衡\">练习这个动作</button><p class=\"english\">Manual</p><a class=\"video\" href=\"https://www.douyin.com/video/7660779024314625999\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>Tail Manual · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：前轮抬离地面，用后轮滑行并保持平衡。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：滑行中前后脚分别靠近桥钉。重心缓慢移向后桥，前轮抬起。以后轮平衡滑行，避免板尾擦地。平稳放下前轮，恢复四轮滑行。以前后脚微调重心，使前轮离地、后轮继续滚动；手臂可以帮助平衡，但不要突然向后仰头或猛踩板尾。</p><p>注意事项：先尝试很短的距离，找到前轮轻轻抬起的位置；结束时缓慢放下前轮，不要用板尾拖地当作刹车。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://skateboardgb.org/faq/10-beginner-tricks-to-learn-at-home/\" target=\"_blank\" rel=\"noreferrer\">Skateboard GB：初学动作教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">09 / 基础动作</div><h2>正向 180</h2><button class=\"lesson-practice\" data-practice=\"正向 180\">练习这个动作</button><p class=\"english\">Frontside 180</p><a class=\"video\" href=\"https://www.douyin.com/video/7674087225420690368\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>F/S 180 · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：肩膀带动身体向正面方向转动，人与板共同旋转半圈。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：以豚跳站姿准备，肩膀预转。点板起跳，肩膀带动正面方向转体。双脚与滑板跟随身体旋转。人与板完成半圈后落地。起跳前肩膀预转，点板时向身体正面方向带动旋转，髋部和滑板随双脚一起转动。</p><p>注意事项：先控制较小转角与平稳着地，再慢慢增加到半圈；避免落地后用膝盖硬拧板子补角度。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://www.skatedeluxe.com/blog/de/trick-tipps/skateboard/flat/how-to-fs-180-ollie/\" target=\"_blank\" rel=\"noreferrer\">skatedeluxe：动作教学 ↗</a></p></article><article class=\"lesson\"><div class=\"number\">10 / 基础动作</div><h2>平地板转</h2><button class=\"lesson-practice\" data-practice=\"平地板转\">练习这个动作</button><p class=\"english\">Shuvit</p><a class=\"video\" href=\"https://www.douyin.com/video/7655251127805733283\" target=\"_blank\" rel=\"noopener noreferrer\"><span class=\"play\">▶</span><span><b>Maschi 抖音教学视频</b><small>Shuv-it · 点击打开抖音 ↗</small></span></a><details><summary><span>动作要点</span><span class=\"cue\"></span></summary><div class=\"notes\"><p>动作认识：不点板尾，双脚带动滑板在地面附近水平转半圈，身体基本不转。先熟悉稳定滑行，了解动作需要的站姿与板的运动方向。</p><p>准备动作：选择平整、干燥且无障碍的地面，戴好头盔和护具。双膝自然弯曲，双脚站稳，确认前方与周围有足够空间。</p><p>动作过程：双脚稳定站在板上。后脚向身后拨板，前脚轻引。滑板在脚下水平转半圈。双脚接住砂纸面，保持平衡。这是不刻意点板尾的平地板转：后脚向身后拨板，前脚轻引，滑板在脚下转动，身体尽量不跟转。</p><p>注意事项：先从小幅度拨板熟悉板的旋转方向，避免大力踢飞。观察板面接近半圈，双脚回到桥钉附近。先以低速和小幅度练习，感到疼痛或失去控制时及时停止，调整好再继续。</p></div></details><p class=\"source\">参考来源：<a href=\"https://shop.ccs.com/pages/a-beginners-guide-to-skateboarding-tricks-part-2\" target=\"_blank\" rel=\"noreferrer\">CCS：平地板转教学 ↗</a></p></article><p class=\"note\">动作要点依据各条公开教学资料整理。新增视频链接依据博主抖音主页的作品标题与动作名称匹配，视频细节尚未逐帧核实。</p>"}}),a==="community"&&(0,s.jsxs)(s.Fragment,{children:[(0,s.jsxs)("div",{className:"community-banner",children:[(0,s.jsxs)("div",{children:[(0,s.jsx)("span",{className:"eyebrow",children:"\u4E00\u8D77\u51FA\u53D1\uFF0C\u4E00\u8D77\u8FDB\u6B65"}),(0,s.jsx)("h2",{children:"\u6ED1\u677F\u8FD9\u4EF6\u4E8B\uFF0C\u4E00\u8D77\u66F4\u6709\u610F\u601D\u3002"}),(0,s.jsx)("p",{children:"\u4E0D\u8BBA\u6C34\u5E73\u9AD8\u4F4E\uFF0C\u603B\u6709\u4EBA\u613F\u610F\u548C\u4F60\u4E00\u8D77\u6ED1\u3002"}),(0,s.jsxs)("button",{className:"btn primary",onClick:()=>c({type:"createEvent"}),children:[(0,s.jsx)(ie,{size:15}),"\u53D1\u8D77\u7EA6\u6ED1"]})]}),(0,s.jsxs)("div",{className:"community-art",children:[(0,s.jsx)(Ml,{size:150,strokeWidth:.8}),(0
